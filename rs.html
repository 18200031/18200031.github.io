<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de sesión v2</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 400px; margin: auto; background-color: #f0f2f5; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        h3 { color: #444; margin-top: 0; text-align: center; font-size: 0.7rem; }
        h2 { color: #1a73e8; margin-top: 0; text-align: center; font-size: 1.4rem; }
        .campo { margin-bottom: 18px; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 6px; color: #444; font-size: 0.9rem; }
        input { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; outline: none; background-color: white; }
        
        input[readonly] { background-color: #f9f9f9; color: #555; cursor: not-allowed; border-color: #eee; font-family: monospace; }

        .tipo-botones { display: flex; gap: 10px; }

        .btn-tipo {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #f9f9f9;
            color: #888;
            transition: all 0.2s;
        }

        .btn-tipo.inicio.activo {
            background-color: #e6f4ea;
            color: #1e7e34;
            border-color: #34a853;
        }

        .btn-tipo.fin.activo {
            background-color: #fce8e6;
            color: #c5221f;
            border-color: #ea4335;
        }

        .btn-tipo:not(.activo):hover {
            background-color: #f0f0f0;
            color: #555;
        }
        
        button[type="submit"] { background: #1a73e8; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        button[type="submit"]:disabled { background: #ccc; }
        .status { font-size: 12px; color: #d93025; text-align: center; margin-top: 10px; font-weight: bold; }
        .success-text { color: #1e8e3e; }
    </style>
    <script>
    function setDateTimeLocalNow() {
      const now = new Date();
      const formatted = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0') + 'T' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0') + ':' +
        String(now.getSeconds()).padStart(2, '0');
      document.getElementById('fecha_hora').value = formatted;
    }

    function cargarAsesoriaDesdeURL() {
      const params = new URLSearchParams(window.location.search);
      const asesoria = params.get('asesoria');
      const inputAsesoria = document.getElementById('asesoria');
      if (asesoria) {
        inputAsesoria.value = asesoria;
        inputAsesoria.readOnly = true;
      }
    }

    function seleccionarTipo(valor) {
      document.getElementById('tipo_registro').value = valor;
      document.getElementById('btn-inicio').classList.toggle('activo', valor === 'Inicio');
      document.getElementById('btn-fin').classList.toggle('activo', valor === 'Fin');
    }

    document.addEventListener('DOMContentLoaded', () => {
      setDateTimeLocalNow();
      cargarAsesoriaDesdeURL();
      seleccionarTipo('Inicio');
    });
    </script>
</head>
<body>

<div class="card">
    <h2>Registro de sesión</h2>
    <h3>CEP Guadix</h3>
    
    <form id="formAsesoria">
        <div class="campo">
            <label for="asesoria">ID:</label>
            <input type="text" id="asesoria" name="asesoria" placeholder="ID" required>
        </div>

        <div class="campo">
            <label>Tipo de Registro:</label>
            <div class="tipo-botones">
                <button type="button" id="btn-inicio" class="btn-tipo inicio" onclick="seleccionarTipo('Inicio')">Inicio</button>
                <button type="button" id="btn-fin" class="btn-tipo fin" onclick="seleccionarTipo('Fin')">Fin</button>
            </div>
            <input type="hidden" id="tipo_registro" name="tipo_registro" required>
        </div>

        <button type="submit" id="btnEnviar" disabled>Esperando GPS...</button>
        <div class="status" id="status_gps">Iniciando GPS...</div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <div class="campo">
            <label>Fecha/hora:</label>
            <input type="datetime-local-input" id="fecha_hora" name="fecha_hora" step="any" readonly required>
        </div>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <div style="display: flex; gap: 10px;">
            <div class="campo" style="flex: 1; min-width: 0;">
                <label>Latitud:</label>
                <input type="number" id="lat" name="lat" step="any" readonly required style="font-size: 13px; padding: 10px 8px;">
            </div>
            <div class="campo" style="flex: 1; min-width: 0;">
                <label>Longitud:</label>
                <input type="number" id="lng" name="lng" step="any" readonly required style="font-size: 13px; padding: 10px 8px;">
            </div>
        </div>

    </form>
</div>

<script>
    const btn = document.getElementById('btnEnviar');
    const statusGps = document.getElementById('status_gps');

    function obtenerUbicacion() {
        if (!navigator.geolocation) {
            statusGps.innerText = "❌ No soportado por el navegador.";
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                let latitud = pos.coords.latitude;
                let longitud = pos.coords.longitude;

                if (latitud >= -90 && latitud <= 90 && longitud >= -180 && longitud <= 180) {
                    document.getElementById('lat').value = latitud.toFixed(5);
                    document.getElementById('lng').value = longitud.toFixed(5);
                    statusGps.innerText = "✅ Ubicación válida y fijada";
                    statusGps.className = "status success-text";
                    btn.disabled = false;
                    btn.innerText = "Enviar Registro";
                } else {
                    statusGps.innerText = "❌ Coordenadas fuera de rango.";
                }
            },
            (err) => {
                statusGps.innerText = "❌ Error: Activa el GPS y recarga.";
                console.error(err);
            }, 
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    window.onload = obtenerUbicacion;

    document.getElementById('formAsesoria').onsubmit = function(e) {
        e.preventDefault();

        btn.disabled = true;
        btn.innerText = "Enviando...";

        const payload = {
            asesoria: document.getElementById('asesoria').value,
            tipo_registro: document.getElementById('tipo_registro').value,
            fecha_hora: document.getElementById('fecha_hora').value,
            lat: parseFloat(document.getElementById('lat').value.replace(',', '.')),
            lng: parseFloat(document.getElementById('lng').value.replace(',', '.'))
        };

        const urlScript = "https://script.google.com/macros/s/AKfycbzo-9fLDhvsi6lFKJ9qu40kiHr6kH7TmejGqhbc7K_7E9cLbIAdKxwhi_MGeH8q1Ta5/exec";

        fetch(urlScript, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload),
            headers: { "Content-Type": "application/json" }
        })
        .then(() => {
            alert("✅ Registro guardado.");
            document.getElementById('formAsesoria').reset();
            btn.disabled = true;
            btn.innerText = "Esperando GPS...";
            cargarAsesoriaDesdeURL();
            seleccionarTipo('Inicio');
            obtenerUbicacion();
        })
        .catch(error => {
            alert("❌ Error de conexión.");
            btn.disabled = false;
            btn.innerText = "Reintentar Envío";
        });
    };
</script>
</body>
</html>
